[toolchain]
anchor_version = "1.2.2"
solana_version = "4.1.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
rwa_exchange = "EosvnRWaZrdLWoSRCwp18QFMCL99GJJFTE1cEqhFJbuA"

[programs.devnet]
rwa_exchange = "EosvnRWaZrdLWoSRCwp18QFMCL99GJJFTE1cEqhFJbuA"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

# Local tests fork Devnet so the real Metaplex Core program is available.
[surfpool]
online = true
datasource_rpc_url = "https://api.devnet.solana.com"

[scripts]
test = "npx ts-mocha -t 1000000 tests/*.ts"
